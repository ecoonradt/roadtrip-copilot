name: Deploy Cloud Infrastructure & Web Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aws-cloud-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            route-builder/package-lock.json
            infra/package-lock.json

      - name: Install dependencies
        run: |
          cd route-builder && npm ci
          cd ../infra && npm ci

      - name: Validate AWS configuration
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::GitHub Actions variable 'AWS_REGION' is not set. This must be set to your primary AWS Region (e.g. us-east-2)." >&2
            exit 1
          fi
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::GitHub Actions variable 'AWS_ROLE_ARN' is not set. This must be set to the deployment role ARN (e.g. arn:aws:iam::597787441620:role/roadtrip-copilot-github-actions-deploy)." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to AWS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          GITHUB_REPO: ${{ github.repository }}
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: ./scripts/deploy_cloud.sh
